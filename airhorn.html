<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">

<!-- Estää kaiken zoomauksen -->
<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
minimum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>Airhorn Pad</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden; /* ei scrollia */
    background: #111;
    font-family: sans-serif;

    /* Estää tekstin auto-zoomauksen iOS */
    -webkit-text-size-adjust: 100%;

    /* Estää tuplaklikki zoomin */
    touch-action: manipulation;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#pad {
    width: 260px;
    height: 260px;
    background: #e10600;
    border-radius: 35px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    font-weight: bold;
    color: white;

    transition: transform 0.05s ease;

    /* Estää valinnan ja highlightin */
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

#pad:active {
    transform: scale(0.95);
}
</style>
</head>
<body>

<div id="pad">AIRHORN 🔊</div>

<audio id="audio" src="FF_CF_foley_airhorn_green.mp3" preload="auto"></audio>

<script>
const pad = document.getElementById("pad");
const audio = document.getElementById("audio");

// iOS unlock
document.addEventListener("touchstart", function unlock() {
    audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
    }).catch(()=>{});
    document.removeEventListener("touchstart", unlock);
}, { once: true });

// Ei päällekkäin – alkaa aina alusta
function playSound() {
    audio.pause();
    audio.currentTime = 0;
    audio.play();
}

// Käytetään pointerdown (ei click)
pad.addEventListener("pointerdown", function(e) {
    e.preventDefault();
    playSound();
}, { passive: false });

// Estetään pinch-zoom
document.addEventListener('gesturestart', function (e) {
    e.preventDefault();
});
</script>

</body>
</html>
