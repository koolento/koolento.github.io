<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Airhorn Pad</title>

<style>
    body {
        margin: 0;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: sans-serif;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
    }

    #pad {
        width: 260px;
        height: 260px;
        background: #e10600;
        border-radius: 35px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 28px;
        font-weight: bold;
        color: white;
        transition: transform 0.04s ease;
    }

    #pad:active {
        transform: scale(0.95);
    }
</style>
</head>
<body>

<div id="pad">TAP TO ARM</div>

<script>
let ctx = null;
let buffer = null;
let armed = false;

const pad = document.getElementById("pad");

async function initAudio() {
    if (armed) return;

    ctx = new (window.AudioContext || window.webkitAudioContext)({
        latencyHint: "interactive"
    });

    await ctx.resume();

    const response = await fetch("FF_CF_foley_airhorn_green.mp3");
    const arrayBuffer = await response.arrayBuffer();
    buffer = await ctx.decodeAudioData(arrayBuffer);

    armed = true;
    pad.textContent = "AIRHORN 🔊";
}

function play() {
    if (!buffer) return;

    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.connect(ctx.destination);
    src.start();
}

// Ensimmäinen kosketus → käynnistää audion
pad.addEventListener("pointerdown", async (e) => {
    e.preventDefault();

    if (!armed) {
        await initAudio();
        play(); // soitetaan heti kun valmis
        return;
    }

    play();
}, { passive: false });

</script>

</body>
</html>
