<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airhorn Pad</title>

<style>
    body {
        margin: 0;
        background: #0d0d0d;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: sans-serif;
        user-select: none;
    }

    #pad {
        width: 240px;
        height: 240px;
        background: #e10600;
        border-radius: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 28px;
        font-weight: bold;
        color: white;
        cursor: pointer;
        transition: transform 0.04s ease;
        touch-action: manipulation;
    }

    #pad:active {
        transform: scale(0.94);
    }
</style>
</head>
<body>

<div id="pad">AIRHORN</div>

<script>
/* ==============================
   ULTRA LOW LATENCY AIRHORN PAD
   ============================== */

let ctx = new (window.AudioContext || window.webkitAudioContext)({
    latencyHint: "interactive"
});

let buffer = null;

// Preload & decode immediately
(async () => {
    const response = await fetch("FF_CF_foley_airhorn_green.mp3");
    const arrayBuffer = await response.arrayBuffer();
    buffer = await ctx.decodeAudioData(arrayBuffer);
})();

// Unlock audio instantly on first interaction (mobile fix)
async function unlock() {
    if (ctx.state === "suspended") {
        await ctx.resume();
    }
}

function play() {
    if (!buffer) return;

    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.connect(ctx.destination);

    // schedule immediately
    src.start(ctx.currentTime);
}

const pad = document.getElementById("pad");

// Pointer is fastest modern input event
pad.addEventListener("pointerdown", async (e) => {
    e.preventDefault();
    await unlock();
    play();
}, { passive: false });

// Keyboard trigger
document.addEventListener("keydown", async (e) => {
    if (e.code === "Space") {
        e.preventDefault();
        await unlock();
        play();
    }
});
</script>

</body>
</html>
