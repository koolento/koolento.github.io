<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Airhorn Pad</title>

<style>
body {
    margin: 0;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: sans-serif;
    touch-action: manipulation;
}

#pad {
    width: 260px;
    height: 260px;
    background: #e10600;
    border-radius: 35px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    font-weight: bold;
    color: white;
    transition: transform 0.05s;
}

#pad:active {
    transform: scale(0.95);
}
</style>
</head>
<body>

<div id="pad">AIRHORN 🔊</div>

<audio id="audio" src="FF_CF_foley_airhorn_green.mp3" preload="auto"></audio>

<script>
const pad = document.getElementById("pad");
const baseAudio = document.getElementById("audio");

// iOS tarvitsee tämän unlockin
document.addEventListener("touchstart", function unlock() {
    baseAudio.play().then(() => {
        baseAudio.pause();
        baseAudio.currentTime = 0;
    }).catch(()=>{});
    document.removeEventListener("touchstart", unlock);
}, { once: true });

function playSound() {
    // cloneNode mahdollistaa polyfonisen toiston
    const sound = baseAudio.cloneNode();
    sound.play();
}

pad.addEventListener("pointerdown", function(e) {
    e.preventDefault();
    playSound();
}, { passive: false });

</script>

</body>
</html>
