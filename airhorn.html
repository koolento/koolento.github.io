<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airhorn Pad</title>
<style>
    body {
        background: #111;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: sans-serif;
        color: white;
    }

    #pad {
        width: 220px;
        height: 220px;
        border-radius: 25px;
        background: #e63946;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 26px;
        font-weight: bold;
        cursor: pointer;
        user-select: none;
        transition: transform 0.05s, background 0.05s;
    }

    #pad:active {
        transform: scale(0.95);
        background: #ff4d5a;
    }

    input {
        margin-top: 25px;
    }

    .status {
        margin-top: 10px;
        font-size: 14px;
        opacity: 0.7;
    }
</style>
</head>
<body>

<div id="pad">AIRHORN</div>
<div class="status" id="status">Ladataan placeholder-audio...</div>
<input type="file" id="fileInput" accept="audio/*">

<script>
let audioContext;
let audioBuffer = null;

async function initAudio() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)({
            latencyHint: "interactive"
        });
    }
    if (audioContext.state === "suspended") {
        await audioContext.resume();
    }
}

async function loadPlaceholder() {
    await initAudio();

    // Julkinen airhorn placeholder
    const response = await fetch("https://www.soundjay.com/misc/sounds/air-horn-01.mp3");
    const arrayBuffer = await response.arrayBuffer();
    audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

    document.getElementById("status").textContent = "Valmis 🔊";
}

document.getElementById("fileInput").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    await initAudio();

    const arrayBuffer = await file.arrayBuffer();
    audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

    document.getElementById("status").textContent = "Oma audio ladattu 🔊";
});

function playSound() {
    if (!audioBuffer) return;

    const source = audioContext.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(audioContext.destination);
    source.start(0);
}

const pad = document.getElementById("pad");

pad.addEventListener("pointerdown", async () => {
    await initAudio();
    playSound();
});

document.addEventListener("keydown", async (e) => {
    if (e.code === "Space") {
        e.preventDefault();
        await initAudio();
        playSound();
    }
});

// Lataa placeholder automaattisesti
loadPlaceholder();
</script>

</body>
</html>
