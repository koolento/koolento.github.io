<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2d6a4f">
<title>Matkahallinta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* ===== RESET & TOKENS ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --ink: #0f1117;
  --paper: #f7f5f0;
  --card: #ffffff;
  --accent: #2d6a4f;
  --accent2: #52b788;
  --accent-light: #d8f3dc;
  --warm: #e9c46a;
  --border: #e0dbd2;
  --muted: #7a7468;
  --error: #c1121f;
  --error-bg: #fff0f0;
  --nav-h: 64px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html { font-size: 16px; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100dvh;
  padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px);
  overscroll-behavior: none;
}

/* ===== TOP HEADER ===== */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(247,245,240,.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  height: 56px;
  display: flex; align-items: center; justify-content: space-between;
}

.topbar-title {
  font-family: 'DM Serif Display', serif;
  font-size: 1.15rem;
  color: var(--ink);
  display: flex; align-items: center; gap: 8px;
}

.topbar-title .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent2);
}

.topbar-right { display: flex; align-items: center; gap: 8px; }

.user-pill {
  font-size: .75rem;
  color: var(--muted);
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 10px;
  max-width: 140px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.icon-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--card);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: .9rem;
  color: var(--muted);
  transition: all .15s;
}
.icon-btn:hover { background: var(--paper); color: var(--ink); }

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 100;
  background: rgba(255,255,255,.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  height: calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  display: flex;
  align-items: flex-start;
  padding-top: 6px;
}

.nav-item {
  flex: 1;
  display: flex; flex-direction: column; align-items: center;
  gap: 3px;
  cursor: pointer;
  padding: 6px 0;
  transition: all .15s;
  -webkit-tap-highlight-color: transparent;
}

.nav-icon {
  width: 44px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 20px;
  font-size: 1.1rem;
  transition: all .2s;
  background: transparent;
}

.nav-label {
  font-size: .65rem;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: .3px;
  transition: color .2s;
}

.nav-item.active .nav-icon { background: var(--accent-light); }
.nav-item.active .nav-label { color: var(--accent); font-weight: 700; }

/* ===== PANELS ===== */
.panel { display: none; padding: 16px; }
.panel.active { display: block; }

/* ===== CARDS ===== */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: 0 1px 4px rgba(15,17,23,.04);
}

.card-title {
  font-family: 'DM Serif Display', serif;
  font-size: 1.05rem;
  color: var(--ink);
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}

/* ===== FORM ELEMENTS ===== */
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: .72rem;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 6px;
}

.field input,
.field select,
.field textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 1rem; /* prevents iOS zoom */
  color: var(--ink);
  background: var(--paper);
  transition: all .2s;
  -webkit-appearance: none;
  appearance: none;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  outline: none;
  border-color: var(--accent);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(45,106,79,.08);
}

.field textarea { min-height: 80px; resize: none; }

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row2 .field { margin-bottom: 0; }

/* ===== BUTTONS ===== */
.btn {
  padding: 13px 20px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: .92rem;
  font-weight: 600;
  transition: all .18s;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  -webkit-tap-highlight-color: transparent;
}

.btn-primary { background: var(--accent); color: #fff; width: 100%; }
.btn-primary:hover { background: #1e5138; }
.btn-primary:active { transform: scale(.98); }

.btn-secondary {
  background: var(--card);
  color: var(--ink);
  border: 1.5px solid var(--border);
  width: 100%;
  margin-top: 8px;
}
.btn-secondary:active { transform: scale(.98); }

.btn-sm {
  padding: 7px 12px;
  font-size: .8rem;
  border-radius: 8px;
}

.btn-danger { background: var(--error-bg); color: var(--error); border: 1px solid #ffc9c9; }

/* ===== RESULT BOX ===== */
.result-box {
  background: linear-gradient(135deg, #ebf8ef, #f0faf5);
  border: 1.5px solid var(--accent2);
  border-radius: 12px;
  padding: 16px;
  margin: 14px 0;
}

.result-box .result-label {
  font-size: .72rem;
  font-weight: 700;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 10px;
}

.result-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 5px 0;
  border-bottom: 1px dashed rgba(45,106,79,.15);
  font-size: .88rem;
}
.result-row:last-child {
  border: none;
  font-weight: 700;
  font-size: 1rem;
  color: var(--accent);
  margin-top: 4px;
  padding-top: 8px;
  border-top: 1.5px solid rgba(45,106,79,.2);
}

.rates-pill {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: .78rem;
  color: var(--muted);
  margin-bottom: 12px;
  line-height: 1.6;
}
.rates-pill strong { color: var(--accent); }

/* ===== HISTORY LIST ===== */
.matka-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 10px;
  position: relative;
  overflow: hidden;
}

.matka-item::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: var(--accent2);
  border-radius: 4px 0 0 4px;
}

.matka-item.tila-lahetetty::before { background: var(--warm); }
.matka-item.tila-hyvaksytty::before { background: #52b788; }

.matka-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}

.matka-nimi {
  font-weight: 700;
  font-size: .95rem;
  flex: 1;
  padding-right: 8px;
}

.tila-pill {
  font-size: .68rem;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: .4px;
  flex-shrink: 0;
}

.tila-avoin { background: #fff8e6; color: #92620a; }
.tila-lahetetty { background: #e0f2fe; color: #0369a1; }
.tila-hyvaksytty { background: var(--accent-light); color: var(--accent); }

.matka-meta {
  font-size: .8rem;
  color: var(--muted);
  margin-bottom: 10px;
  line-height: 1.5;
}

.matka-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.matka-summa {
  font-family: 'DM Serif Display', serif;
  font-size: 1.1rem;
  color: var(--accent);
}

.matka-actions { display: flex; gap: 6px; }

/* ===== STATS BAR ===== */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}

.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  text-align: center;
}

.stat-num {
  font-family: 'DM Serif Display', serif;
  font-size: 1.5rem;
  color: var(--accent);
  line-height: 1;
}

.stat-label {
  font-size: .7rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .4px;
  margin-top: 4px;
}

/* ===== KULU ROWS ===== */
.kulu-rivi {
  background: var(--paper);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 8px;
  position: relative;
}

.kulu-rivi .row2 { margin-bottom: 8px; }
.kulu-rivi .row2:last-child { margin-bottom: 0; }

.kulu-delete {
  position: absolute;
  top: 10px; right: 10px;
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 1px solid #ffc9c9;
  background: var(--error-bg);
  color: var(--error);
  font-size: .8rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

/* ===== TOAST ===== */
#toast {
  position: fixed;
  bottom: calc(var(--nav-h) + var(--safe-bottom) + 14px);
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: #fff;
  padding: 11px 20px;
  border-radius: 30px;
  font-size: .88rem;
  font-weight: 500;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: all .3s;
  z-index: 999;
  box-shadow: 0 4px 20px rgba(0,0,0,.2);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== LOADING ===== */
#loading-screen {
  position: fixed; inset: 0;
  background: var(--paper);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 16px;
  z-index: 999;
}

.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--accent-light);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

#loading-screen p {
  font-size: .88rem;
  color: var(--muted);
}

/* ===== EMPTY STATE ===== */
.empty {
  text-align: center;
  padding: 48px 20px;
  color: var(--muted);
}
.empty .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
.empty p { font-size: .9rem; line-height: 1.6; }

/* ===== VIENTI ===== */
.vienti-info {
  background: var(--accent-light);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: .83rem;
  color: var(--accent);
  margin-bottom: 14px;
  line-height: 1.5;
}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading-screen">
  <div class="spinner"></div>
  <p>Ladataan...</p>
</div>

<!-- Top bar -->
<div class="topbar">
  <div class="topbar-title">
    <div class="dot"></div>
    Matkahallinta
  </div>
  <div class="topbar-right">
    <div class="user-pill" id="user-email">—</div>
    <div class="icon-btn" onclick="kirjauduUlos()" title="Kirjaudu ulos">↩</div>
  </div>
</div>

<!-- Panels -->
<div id="panel-uusi" class="panel active">
  <div class="card">
    <div class="card-title">✈️ Uusi matka</div>

    <div class="field">
      <label>Kohde / matkan nimi</label>
      <input type="text" id="m-nimi" placeholder="esim. Asiakaskäynti Tampere">
    </div>
    <div class="field">
      <label>Kohdeosoite</label>
      <input type="text" id="m-osoite" placeholder="Kadunnimi 1, Kaupunki">
    </div>

    <div class="row2">
      <div class="field">
        <label>Lähtöpäivä</label>
        <input type="date" id="m-lahto-pvm">
      </div>
      <div class="field">
        <label>Lähtöaika</label>
        <input type="time" id="m-lahto-aika">
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>Paluupäivä</label>
        <input type="date" id="m-paluu-pvm">
      </div>
      <div class="field">
        <label>Paluuaika</label>
        <input type="time" id="m-paluu-aika">
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>Kulkuneuvo</label>
        <select id="m-kulkuneuvo" onchange="toggleKm()">
          <option value="oma-auto">Oma auto</option>
          <option value="tyoauto">Työauto</option>
          <option value="julkinen">Julkinen liikenne</option>
          <option value="taksi">Taksi</option>
          <option value="lento">Lento</option>
          <option value="juna">Juna</option>
          <option value="muu">Muu</option>
        </select>
      </div>
      <div class="field" id="km-field">
        <label>Kilometrit</label>
        <input type="number" id="m-km" placeholder="0" min="0" inputmode="numeric">
      </div>
    </div>

    <div class="field">
      <label>Tarkoitus</label>
      <input type="text" id="m-tarkoitus" placeholder="esim. asiakaskokous, koulutus...">
    </div>

    <button class="btn btn-secondary" onclick="laskePaivaraha()">🧮 Laske päiväraha</button>
  </div>

  <!-- Laskelma -->
  <div id="laskelma-card" class="card" style="display:none">
    <div class="card-title">📊 Laskelma</div>
    <div id="laskelma-content"></div>
    <button class="btn btn-primary" onclick="tallenna()" id="tallenna-btn">💾 Tallenna matka</button>
  </div>

  <!-- Kulut -->
  <div id="kulut-card" class="card" style="display:none">
    <div class="card-title">🧾 Kulut <span style="font-family:'DM Sans';font-size:.8rem;color:var(--muted);font-weight:400">(valinnainen)</span></div>
    <div id="kulut-lista"></div>
    <button class="btn btn-secondary btn-sm" onclick="lisaaKulu()" style="width:auto;margin-top:4px">➕ Lisää kulu</button>
  </div>
</div>

<div id="panel-historia" class="panel">
  <div class="stats-grid" id="stats-grid"></div>
  <div id="historia-lista">
    <div class="empty"><div class="empty-icon">🗺️</div><p>Ei vielä matkoja.<br>Lisää ensimmäinen matka!</p></div>
  </div>
</div>

<div id="panel-vienti" class="panel">
  <div class="card">
    <div class="card-title">📥 Vie tiedot</div>
    <div class="vienti-info">Lataa kaikki matkatiedot CSV-tiedostona joka aukeaa suoraan Excelissä.</div>
    <div class="field">
      <label>Nimesi</label>
      <input type="text" id="v-nimi" placeholder="Etunimi Sukunimi">
    </div>
    <div class="field">
      <label>Yritys</label>
      <input type="text" id="v-yritys" placeholder="Yritys Oy">
    </div>
    <button class="btn btn-primary" onclick="vieCSV()">⬇ Lataa CSV</button>
    <button class="btn btn-secondary" onclick="tulostaRaportti()">🖨 Avaa tulostusnäkymä</button>
  </div>
</div>

<!-- Bottom nav -->
<nav class="bottom-nav">
  <div class="nav-item active" onclick="nayta('uusi')" id="nav-uusi">
    <div class="nav-icon">✈️</div>
    <div class="nav-label">Uusi matka</div>
  </div>
  <div class="nav-item" onclick="nayta('historia')" id="nav-historia">
    <div class="nav-icon">📋</div>
    <div class="nav-label">Historia</div>
  </div>
  <div class="nav-item" onclick="nayta('vienti')" id="nav-vienti">
    <div class="nav-icon">📥</div>
    <div class="nav-label">Vie</div>
  </div>
</nav>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== SUPABASE =====
const SUPABASE_URL = 'https://wpqpgpnxudoufmzdcqhv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_aeetk2nXEQnKOTYS767A8w_3NOHaGbt';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let matkat = [];
let aktiivisetKulut = [];
let laskelmaData = null;

// ===== INIT =====
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }
  currentUser = session.user;
  document.getElementById('user-email').textContent = currentUser.email;
  await lataaMatkat();
  document.getElementById('loading-screen').style.display = 'none';

  // Oletuspäivät
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('m-lahto-pvm').value = today;
  document.getElementById('m-paluu-pvm').value = today;
  document.getElementById('m-lahto-aika').value = '08:00';
  document.getElementById('m-paluu-aika').value = '17:00';
}

// ===== NAVIGATION =====
function nayta(panel) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('panel-' + panel).classList.add('active');
  document.getElementById('nav-' + panel).classList.add('active');
  if (panel === 'historia') paivitaHistoria();
}

// ===== VUOSIKORVAUKSET =====
const VUOSIKORVAUKSET = {
  2020: { osa: 20, koko: 44, km: 0.44 },
  2021: { osa: 20, koko: 44, km: 0.44 },
  2022: { osa: 20, koko: 45, km: 0.46 },
  2023: { osa: 23, koko: 48, km: 0.53 },
  2024: { osa: 24, koko: 53, km: 0.59 },
  2025: { osa: 24, koko: 53, km: 0.59 },
  2026: { osa: 25, koko: 54, km: 0.55 },
};

function haeKorvaukset(vuosi) {
  if (VUOSIKORVAUKSET[vuosi]) return VUOSIKORVAUKSET[vuosi];
  const vuodet = Object.keys(VUOSIKORVAUKSET).map(Number).sort((a,b) => b-a);
  return VUOSIKORVAUKSET[vuodet.find(v => v <= vuosi) || vuodet[vuodet.length-1]];
}

// ===== PÄIVÄRAHA LASKENTA =====
function laskePaivaraha() {
  const lahtoPvm = document.getElementById('m-lahto-pvm').value;
  const lahtoAika = document.getElementById('m-lahto-aika').value;
  const paluuPvm = document.getElementById('m-paluu-pvm').value;
  const paluuAika = document.getElementById('m-paluu-aika').value;
  const km = parseFloat(document.getElementById('m-km').value) || 0;

  if (!lahtoPvm || !lahtoAika || !paluuPvm || !paluuAika) {
    toast('⚠️ Täytä päivä- ja aikatiedot'); return;
  }

  const lahto = new Date(lahtoPvm + 'T' + lahtoAika);
  const paluu = new Date(paluuPvm + 'T' + paluuAika);
  if (paluu <= lahto) { toast('⚠️ Paluuaika ennen lähtöaikaa'); return; }

  const vuosi = lahto.getFullYear();
  const kor = haeKorvaukset(vuosi);
  const kestominuutit = (paluu - lahto) / 60000;
  const kestotunnit = kestominuutit / 60;
  const paivat = Math.floor(kestotunnit / 24);
  const jatko = kestotunnit % 24;
  const tunnit = Math.floor(kestotunnit);
  const minuutit = Math.round(kestominuutit % 60);

  let paivaraha = 0;
  let rivit = [];

  if (paivat > 0) {
    const s = paivat * kor.koko;
    paivaraha += s;
    rivit.push([`${paivat} × kokopäiväraha`, `${s.toFixed(2)} €`]);
  }
  if (jatko >= 10) {
    paivaraha += kor.koko;
    rivit.push(['Jatkuva osuus (≥10h)', `${kor.koko.toFixed(2)} €`]);
  } else if (jatko >= 6) {
    paivaraha += kor.osa;
    rivit.push(['Jatkuva osuus (6–10h)', `${kor.osa.toFixed(2)} €`]);
  } else if (paivat === 0) {
    if (jatko >= 10) { paivaraha += kor.koko; rivit.push(['Kokopäiväraha (≥10h)', `${kor.koko.toFixed(2)} €`]); }
    else if (jatko >= 6) { paivaraha += kor.osa; rivit.push(['Osapäiväraha (6–10h)', `${kor.osa.toFixed(2)} €`]); }
    else rivit.push(['Alle 6h → ei päivärahaa', '0,00 €']);
  }

  const kmKorvaus = km > 0 ? km * kor.km : 0;
  if (km > 0) rivit.push([`${km} km × ${kor.km} €/km`, `${kmKorvaus.toFixed(2)} €`]);
  const yhteensa = paivaraha + kmKorvaus;

  laskelmaData = { kestotunnit, tunnit, minuutit, paivaraha, kmKorvaus, yhteensa, vuosi, kor };

  const ratesHtml = `<div class="rates-pill">Verohallinnon korvaukset <strong>${vuosi}</strong>: osapäiväraha <strong>${kor.osa} €</strong> · kokopäiväraha <strong>${kor.koko} €</strong> · km-korvaus <strong>${kor.km} €/km</strong></div>`;

  const riviHtml = rivit.map(([l,v]) => `<div class="result-row"><span>${l}</span><span>${v}</span></div>`).join('');

  document.getElementById('laskelma-content').innerHTML = `
    <p style="font-size:.83rem;color:var(--muted);margin-bottom:12px">Kesto: <strong>${tunnit}h ${minuutit}min</strong></p>
    ${ratesHtml}
    <div class="result-box">
      <div class="result-label">Laskelma</div>
      ${riviHtml}
      <div class="result-row"><span>Yhteensä</span><span>${yhteensa.toFixed(2)} €</span></div>
    </div>
  `;

  document.getElementById('laskelma-card').style.display = 'block';
  document.getElementById('kulut-card').style.display = 'block';
  document.getElementById('laskelma-card').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ===== KULUT =====
function lisaaKulu() {
  aktiivisetKulut.push({ id: Date.now(), tyyppi: '', kuvaus: '', summa: '', alv: '0', kuitti: false });
  paivitaKuluLista();
}

function paivitaKuluLista() {
  const el = document.getElementById('kulut-lista');
  if (!aktiivisetKulut.length) { el.innerHTML = ''; return; }
  el.innerHTML = aktiivisetKulut.map(k => `
    <div class="kulu-rivi">
      <button class="kulu-delete" onclick="poistaKulu(${k.id})">✕</button>
      <div class="row2" style="margin-bottom:8px">
        <div class="field" style="margin:0">
          <label>Tyyppi</label>
          <select onchange="paivitaKulu(${k.id},'tyyppi',this.value)">
            <option value="" ${!k.tyyppi?'selected':''}>Valitse...</option>
            <option value="Majoitus" ${k.tyyppi==='Majoitus'?'selected':''}>Majoitus</option>
            <option value="Ruokailu" ${k.tyyppi==='Ruokailu'?'selected':''}>Ruokailu</option>
            <option value="Liikenne" ${k.tyyppi==='Liikenne'?'selected':''}>Liikenne</option>
            <option value="Pysäköinti" ${k.tyyppi==='Pysäköinti'?'selected':''}>Pysäköinti</option>
            <option value="Edustus" ${k.tyyppi==='Edustus'?'selected':''}>Edustus</option>
            <option value="Muu" ${k.tyyppi==='Muu'?'selected':''}>Muu</option>
          </select>
        </div>
        <div class="field" style="margin:0">
          <label>Summa (€)</label>
          <input type="number" value="${k.summa}" placeholder="0.00" inputmode="decimal" step="0.01"
            onchange="paivitaKulu(${k.id},'summa',this.value)">
        </div>
      </div>
      <div class="field" style="margin:0">
        <label>Kuvaus</label>
        <input type="text" value="${k.kuvaus}" placeholder="Lyhyt kuvaus..."
          onchange="paivitaKulu(${k.id},'kuvaus',this.value)">
      </div>
    </div>
  `).join('');
}

function paivitaKulu(id, k, v) {
  const kulu = aktiivisetKulut.find(x => x.id === id);
  if (kulu) kulu[k] = v;
}

function poistaKulu(id) {
  aktiivisetKulut = aktiivisetKulut.filter(k => k.id !== id);
  paivitaKuluLista();
}

// ===== TALLENNA =====
async function tallenna() {
  if (!laskelmaData) { laskePaivaraha(); return; }
  const nimi = document.getElementById('m-nimi').value;
  if (!nimi) { toast('⚠️ Anna kohteen nimi'); return; }

  const btn = document.getElementById('tallenna-btn');
  btn.disabled = true; btn.textContent = 'Tallennetaan...';

  const matka = {
    user_id: currentUser.id,
    nimi,
    osoite: document.getElementById('m-osoite').value,
    lahto_pvm: document.getElementById('m-lahto-pvm').value,
    lahto_aika: document.getElementById('m-lahto-aika').value,
    paluu_pvm: document.getElementById('m-paluu-pvm').value,
    paluu_aika: document.getElementById('m-paluu-aika').value,
    kulkuneuvo: document.getElementById('m-kulkuneuvo').value,
    km: parseFloat(document.getElementById('m-km').value) || 0,
    tarkoitus: document.getElementById('m-tarkoitus').value,
    kesto_tunnit: laskelmaData.kestotunnit,
    paivaraha: laskelmaData.paivaraha,
    km_korvaus: laskelmaData.kmKorvaus,
    yhteensa: laskelmaData.yhteensa,
    lahto_vuosi: laskelmaData.vuosi,
    tila: 'avoin'
  };

  const { data: matkaData, error } = await sb.from('matkat').insert(matka).select().single();
  if (error) { toast('❌ Tallennus epäonnistui: ' + error.message); btn.disabled = false; btn.textContent = '💾 Tallenna matka'; return; }

  // Tallenna kulut
  if (aktiivisetKulut.length > 0) {
    const kuluRows = aktiivisetKulut.filter(k => k.summa).map(k => ({
      matka_id: matkaData.id,
      user_id: currentUser.id,
      tyyppi: k.tyyppi,
      kuvaus: k.kuvaus,
      summa: parseFloat(k.summa) || 0,
      alv: k.alv,
      kuitti: k.kuitti
    }));
    if (kuluRows.length) await sb.from('kulut').insert(kuluRows);
  }

  toast('✅ Matka tallennettu!');
  tyhjennaLomake();
  await lataaMatkat();
  btn.disabled = false; btn.textContent = '💾 Tallenna matka';
}

function tyhjennaLomake() {
  ['m-nimi','m-osoite','m-km','m-tarkoitus'].forEach(id => document.getElementById(id).value = '');
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('m-lahto-pvm').value = today;
  document.getElementById('m-paluu-pvm').value = today;
  document.getElementById('m-lahto-aika').value = '08:00';
  document.getElementById('m-paluu-aika').value = '17:00';
  document.getElementById('laskelma-card').style.display = 'none';
  document.getElementById('kulut-card').style.display = 'none';
  aktiivisetKulut = [];
  laskelmaData = null;
  paivitaKuluLista();
}

// ===== LATAA MATKAT =====
async function lataaMatkat() {
  const { data } = await sb.from('matkat').select('*, kulut(*)').order('luotu', { ascending: false });
  matkat = data || [];
}

// ===== HISTORIA =====
function paivitaHistoria() {
  const yhtPaivaraha = matkat.reduce((s,m) => s + (m.paivaraha||0), 0);
  const yhtKm = matkat.reduce((s,m) => s + (m.km_korvaus||0), 0);
  const yhtKulut = matkat.reduce((s,m) => s + (m.kulut||[]).reduce((ss,k) => ss+(k.summa||0),0), 0);

  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card"><div class="stat-num">${matkat.length}</div><div class="stat-label">Matkaa</div></div>
    <div class="stat-card"><div class="stat-num">${(yhtPaivaraha+yhtKm+yhtKulut).toFixed(0)} €</div><div class="stat-label">Yhteensä</div></div>
    <div class="stat-card"><div class="stat-num">${yhtPaivaraha.toFixed(0)} €</div><div class="stat-label">Päivärahat</div></div>
    <div class="stat-card"><div class="stat-num">${yhtKm.toFixed(0)} €</div><div class="stat-label">KM-korvaukset</div></div>
  `;

  if (!matkat.length) {
    document.getElementById('historia-lista').innerHTML = '<div class="empty"><div class="empty-icon">🗺️</div><p>Ei vielä matkoja.</p></div>';
    return;
  }

  document.getElementById('historia-lista').innerHTML = matkat.map(m => {
    const kuluYht = (m.kulut||[]).reduce((s,k) => s+(k.summa||0), 0);
    const yht = (m.paivaraha||0) + (m.km_korvaus||0) + kuluYht;
    const tila = m.tila || 'avoin';
    const tilaLabel = { avoin: 'Avoin', lahetetty: 'Lähetetty', hyvaksytty: 'Hyväksytty' }[tila] || tila;
    return `
      <div class="matka-item tila-${tila}">
        <div class="matka-header">
          <div class="matka-nimi">${m.nimi || '—'}</div>
          <span class="tila-pill tila-${tila}">${tilaLabel}</span>
        </div>
        <div class="matka-meta">
          📅 ${m.lahto_pvm} ${m.lahto_aika} → ${m.paluu_pvm} ${m.paluu_aika}<br>
          ${m.osoite ? '📍 ' + m.osoite : ''}
        </div>
        <div class="matka-footer">
          <div class="matka-summa">${yht.toFixed(2)} €</div>
          <div class="matka-actions">
            <button class="btn btn-sm btn-secondary" style="width:auto" onclick="muutaTila('${m.id}','${tila}')">Tila</button>
            <button class="btn btn-sm btn-danger" style="width:auto" onclick="poistaMatka('${m.id}')">✕</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

async function muutaTila(id, nykyinen) {
  const tilat = ['avoin','lahetetty','hyvaksytty'];
  const uusi = tilat[(tilat.indexOf(nykyinen)+1) % tilat.length];
  await sb.from('matkat').update({ tila: uusi }).eq('id', id);
  await lataaMatkat();
  paivitaHistoria();
  toast('Tila: ' + { avoin:'Avoin', lahetetty:'Lähetetty', hyvaksytty:'Hyväksytty' }[uusi]);
}

async function poistaMatka(id) {
  if (!confirm('Poistetaanko matka?')) return;
  await sb.from('matkat').delete().eq('id', id);
  await lataaMatkat();
  paivitaHistoria();
  toast('Matka poistettu');
}

// ===== VIENTI CSV =====
function vieCSV() {
  if (!matkat.length) { toast('Ei matkoja vietäväksi'); return; }
  const nimi = document.getElementById('v-nimi').value || '___';
  const yritys = document.getElementById('v-yritys').value || '___';
  const header = ['#','Kohde','Osoite','Lähtö','Paluu','Kesto (h)','Kulkuneuvo','KM','Päiväraha (€)','KM-korvaus (€)','Muut kulut (€)','Yhteensä (€)','Tila'];
  const rivit = matkat.map((m,i) => {
    const kuluYht = (m.kulut||[]).reduce((s,k) => s+(k.summa||0),0);
    return [i+1, m.nimi||'', m.osoite||'', `${m.lahto_pvm} ${m.lahto_aika}`, `${m.paluu_pvm} ${m.paluu_aika}`,
      (m.kesto_tunnit||0).toFixed(1), m.kulkuneuvo||'', m.km||0,
      (m.paivaraha||0).toFixed(2), (m.km_korvaus||0).toFixed(2), kuluYht.toFixed(2),
      (m.yhteensa||0+kuluYht).toFixed(2), m.tila||'avoin'];
  });
  const csv = '\uFEFF' + [
    [`Matkakorvausilmoitus – ${nimi} – ${yritys}`],
    [`Tulostettu: ${new Date().toLocaleDateString('fi-FI')}`],
    [],
    header,
    ...rivit
  ].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  a.download = `matkat_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  toast('✅ CSV ladattu!');
}

function tulostaRaportti() {
  if (!matkat.length) { toast('Ei matkoja'); return; }
  const nimi = document.getElementById('v-nimi').value || '___________';
  const yritys = document.getElementById('v-yritys').value || '___________';
  const yhtP = matkat.reduce((s,m) => s+(m.paivaraha||0),0);
  const yhtK = matkat.reduce((s,m) => s+(m.km_korvaus||0),0);
  const yhtKu = matkat.reduce((s,m) => s+(m.kulut||[]).reduce((ss,k) => ss+(k.summa||0),0),0);
  const w = window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Matkakorvausilmoitus</title>
  <style>body{font-family:Arial,sans-serif;max-width:800px;margin:40px auto;font-size:13px}
  table{width:100%;border-collapse:collapse}th,td{padding:7px 6px;border:1px solid #ddd;text-align:left}
  th{background:#f5f5f5;font-size:11px;text-transform:uppercase}
  tfoot td{font-weight:700;background:#e8f5e9}
  h2{margin-bottom:4px}p{margin:2px 0;color:#555;font-size:12px}
  .total{font-size:1.1em;color:#2d6a4f}
  @media print{button{display:none}}</style></head><body>
  <h2>MATKAKORVAUSILMOITUS</h2>
  <p><strong>Tekijä:</strong> ${nimi} &nbsp;&nbsp; <strong>Yritys:</strong> ${yritys} &nbsp;&nbsp; <strong>Päiväys:</strong> ${new Date().toLocaleDateString('fi-FI')}</p>
  <br>
  <table><thead><tr><th>Kohde</th><th>Lähtö</th><th>Paluu</th><th>Päiväraha</th><th>KM-korv.</th><th>Kulut</th><th>Yhteensä</th></tr></thead>
  <tbody>${matkat.map(m => {
    const ku = (m.kulut||[]).reduce((s,k) => s+(k.summa||0),0);
    return `<tr><td>${m.nimi||''}</td><td>${m.lahto_pvm}</td><td>${m.paluu_pvm}</td>
    <td>${(m.paivaraha||0).toFixed(2)} €</td><td>${(m.km_korvaus||0).toFixed(2)} €</td>
    <td>${ku.toFixed(2)} €</td><td>${((m.yhteensa||0)+ku).toFixed(2)} €</td></tr>`;
  }).join('')}</tbody>
  <tfoot><tr><td colspan="3">YHTEENSÄ</td><td>${yhtP.toFixed(2)} €</td><td>${yhtK.toFixed(2)} €</td><td>${yhtKu.toFixed(2)} €</td>
  <td class="total">${(yhtP+yhtK+yhtKu).toFixed(2)} €</td></tr></tfoot></table>
  <br><p>Allekirjoitus: ___________________________ &nbsp;&nbsp; Hyväksyjä: ___________________________</p>
  <p style="font-size:11px;color:#999;margin-top:16px">Päivärahat Verohallinnon vuosittaisten päätösten mukaan.</p>
  <button onclick="window.print()" style="margin-top:20px;padding:10px 20px;background:#2d6a4f;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px">🖨 Tulosta</button>
  </body></html>`);
}

// ===== HELPERS =====
function toggleKm() {
  const v = document.getElementById('m-kulkuneuvo').value;
  document.getElementById('km-field').style.display = v === 'oma-auto' ? 'block' : 'none';
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

async function kirjauduUlos() {
  await sb.auth.signOut();
  window.location.href = 'login.html';
}

init();
</script>
